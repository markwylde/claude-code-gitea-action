name: Build and Push Docker Image

on:
  push:
    branches: [gitea]
    paths:
      - Dockerfile
      - package.json
      - bun.lock
      - base-action/package.json
      - base-action/bun.lock
  workflow_dispatch:
    inputs:
      image_name:
        description: "Image name for claude-code-gitea"
        required: false
        default: ghcr.io/markwylde/claude-code-gitea

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ inputs.image_name }}:latest
            ${{ inputs.image_name }}:${{ github.sha }}
